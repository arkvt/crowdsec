syntax = "proto3";

package probesync;

option go_package = "github.com/crowdsecurity/crowdsec/pkg/probesync/pb";

// ProbeSync 探针同步服务 - 双向流通信
service ProbeSync {
  // Connect 双向流：探针发起连接，保持长连接
  rpc Connect(stream ProbeMessage) returns (stream BackendMessage);
}

// ========== 探针 → 后端 ==========

// ProbeMessage 探针发送的消息
message ProbeMessage {
  string probe_id = 1;
  oneof payload {
    Heartbeat heartbeat = 10;
    DataBatch data_batch = 11;
    CommandAck command_ack = 12;
  }
}

// Heartbeat 心跳消息
message Heartbeat {
  string timestamp = 1;
  ProbeStatus status = 2;
}

// ProbeStatus 探针状态
message ProbeStatus {
  string version = 1;
  int64 uptime_seconds = 2;
  int64 pending_access_logs = 3;
  int64 pending_alerts = 4;
  int64 pending_decisions = 5;
  int64 pending_host_logs = 6;
}

// DataBatch 数据批次
message DataBatch {
  string batch_id = 1;           // 幂等键: {probe_id}-{payload}-{from}-{to}
  int64 cursor_from = 4;
  int64 cursor_to = 5;
  string timestamp = 6;
  oneof payload {
    CaddyLogBatch caddy_logs = 10;
    AlertBatch alerts = 11;
    DecisionBatch decisions = 12;
    HostActivityLogBatch host_activity_logs = 13;
    HostProtectionLogBatch host_protection_logs = 14;
  }
}

// ========== 数据结构定义 ==========

// CaddyLogBatch 访问日志批次
message CaddyLogBatch {
  repeated CaddyLog items = 1;
}

// CaddyLog Caddy 访问日志结构
message CaddyLog {
  string level = 1;
  double ts = 2;
  string logger = 3;
  string msg = 4;
  CaddyRequest request = 5;
  int64 bytes_read = 6;
  string user_id = 7;
  double duration = 8;
  int64 size = 9;
  uint32 status = 10;
  map<string, StringList> resp_headers = 11;
}

// CaddyRequest 请求详情
message CaddyRequest {
  string remote_ip = 1;
  string remote_port = 2;
  string client_ip = 3;
  string proto = 4;
  string method = 5;
  string host = 6;
  string uri = 7;
  map<string, StringList> headers = 8;
  CaddyTls tls = 9;
}

// CaddyTls TLS 信息
message CaddyTls {
  bool resumed = 1;
  uint32 version = 2;
  uint32 cipher_suite = 3;
  string proto = 4;
  string server_name = 5;
}

// StringList 字符串列表
message StringList {
  repeated string values = 1;
}

// AlertBatch 告警批次
message AlertBatch {
  repeated Alert items = 1;
}

// Alert 告警结构
message Alert {
  int64 id = 1;
  string created_at = 2;
  string updated_at = 3;
  string scenario = 4;
  string bucket_id = 5;
  string message = 6;
  int32 events_count = 7;
  string started_at = 8;
  string stopped_at = 9;
  string source_ip = 10;
  string source_range = 11;
  string source_as_number = 12;
  string source_as_name = 13;
  string source_country = 14;
  double source_latitude = 15;
  double source_longitude = 16;
  string source_scope = 17;
  string source_value = 18;
  int32 capacity = 19;
  string leak_speed = 20;
  string scenario_version = 21;
  string scenario_hash = 22;
  bool simulated = 23;
  string uuid = 24;
  bool remediation = 25;
  int64 machine_alerts = 26;
}

// DecisionBatch 决策批次
message DecisionBatch {
  repeated Decision items = 1;
}

// HostActivityLogBatch 主机文件活动日志批次
message HostActivityLogBatch {
  repeated HostActivityLog items = 1;
}

// HostActivityLog 主机文件活动日志结构
message HostActivityLog {
  int64 id = 1;
  string timestamp = 2;
  string file_path = 3;
  string file_name = 4;
  string operation = 5;
  string user = 6;
  string process = 7;
  string validation = 8;
  int32 is_folder = 9;
  string uploaded_at = 10;
}

// HostProtectionLogBatch 主机文件保护日志批次
message HostProtectionLogBatch {
  repeated HostProtectionLog items = 1;
}

// HostProtectionLog 主机文件保护日志结构
message HostProtectionLog {
  int64 id = 1;
  string timestamp = 2;
  string file_path = 3;
  string file_name = 4;
  string action = 5;
  int32 success = 6;
  int64 unlock_duration = 7;
  string error_message = 8;
  string uploaded_at = 9;
}

// Decision 决策结构
message Decision {
  int64 id = 1;
  string created_at = 2;
  string updated_at = 3;
  string until = 4;
  string scenario = 5;
  string type = 6;
  int64 start_ip = 7;
  int64 end_ip = 8;
  int64 start_suffix = 9;
  int64 end_suffix = 10;
  int64 ip_size = 11;
  string scope = 12;
  string value = 13;
  string origin = 14;
  bool simulated = 15;
  string uuid = 16;
  int64 alert_decisions = 17;
}

// CommandAck 指令执行确认
message CommandAck {
  string command_id = 1;
  CommandStatus status = 2;
  string result = 3;             // JSON 编码的结果
  string error = 4;
}

// CommandStatus 指令执行状态
enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_SUCCESS = 1;
  COMMAND_STATUS_FAILED = 2;
}

// ========== 后端 → 探针 ==========

// BackendMessage 后端发送的消息
message BackendMessage {
  oneof payload {
    HeartbeatAck heartbeat_ack = 10;
    BatchAck batch_ack = 11;
    Command command = 12;
    ConfigUpdate config_update = 13;
  }
}

// HeartbeatAck 心跳响应
message HeartbeatAck {
  string server_time = 1;
  bool config_update_available = 2;
}

// BatchAck 批次确认
message BatchAck {
  string batch_id = 1;
  AckStatus status = 2;
  string error = 3;
}

// AckStatus 确认状态枚举
enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  ACK_STATUS_OK = 1;
  ACK_STATUS_DUPLICATE = 2;      // 幂等：重复 batch_id
  ACK_STATUS_ERROR = 3;
}

// Command 指令消息
message Command {
  string id = 1;
  CommandType type = 2;
  bytes params = 3;              // JSON 编码的参数
  string created_at = 4;
  string expires_at = 5;
}

// CommandType 指令类型枚举
enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_PING = 1;
  COMMAND_TYPE_FORCE_SYNC = 2;
  COMMAND_TYPE_ADD_WHITELIST = 3;
  COMMAND_TYPE_REMOVE_WHITELIST = 4;
  COMMAND_TYPE_ADD_DECISION = 5;
  COMMAND_TYPE_REMOVE_DECISION = 6;
  COMMAND_TYPE_UPDATE_CONFIG = 7;
  COMMAND_TYPE_HOST_LOCK_PATH = 8;
  COMMAND_TYPE_HOST_TEMP_UNLOCK_PATH = 9;
  COMMAND_TYPE_HOST_EMERGENCY_UNLOCK = 10;
  COMMAND_TYPE_HOST_QUERY_STATUS = 11;
  COMMAND_TYPE_HOST_APPLY_POLICY = 12;
}

// ConfigUpdate 配置更新
message ConfigUpdate {
  string version = 1;
  bytes config = 2;              // YAML 配置
}
